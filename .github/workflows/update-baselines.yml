name: Update test baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        run: ./build.sh

      - name: Regenerate baselines
        run: GOLDEN_UPDATE=1 BUDGET_UPDATE=1 tests/run_tests.sh || true

      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add tests/*.txt
          if git diff --cached --quiet; then echo "No baseline changes"; exit 0; fi
          git diff --cached --stat
          git commit -m "Update test baselines (CI, ${GITHUB_SHA::7})"
          git push
