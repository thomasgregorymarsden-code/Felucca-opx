name: Build and publish

# A push to opx-engine: build, test, publish the site (its installer offers the latest published release; this
# build's installer is under dev/). A release published on GitHub (tag vX.Y.Z): build it as that version, test
# it, attach the package and its licence files to the release, then run this workflow on opx-engine, which publishes
# the site with it. (The site is deployed from the branch only: GitHub Pages' environment takes the default branch.)
on:
  push:
    branches: [opx-engine]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          # a failing build's errors as annotations (readable through the API without the log)
          b() { ./build.sh "$@" 2>&1 | tee -a build.log || { grep -a -iE "error|undefined|FAIL" build.log | head -30 | sed 's/^/::error::/'; exit 1; }; }
          if [ "${{ github.event_name }}" = release ]; then
            ver="${GITHUB_REF_NAME#v}"
            b --release "$ver"
            echo "REL=$ver" >> "$GITHUB_ENV"
          fi
          b                                            # (the development build: build/felucca.fwsc)

      - name: Toolchain float options (diagnostic, OPX fork; to be removed)
        shell: bash
        continue-on-error: true
        run: |
          set +e +o pipefail
          tc=~/.jieli/toolchain/pi32v2/bin
          echo 'int x;' > /tmp/x.c
          $tc/clang -target pi32v2 -mattr=help -c /tmp/x.c -o /tmp/x.o 2>&1 | grep -iE "fp|float|dsp|mac|fpu" | head -20 | sed 's/^/::notice::mattr: /'
          $tc/clang -target pi32v2 -mcpu=help -c /tmp/x.c -o /tmp/x.o 2>&1 | head -15 | sed 's/^/::notice::mcpu: /'
          $tc/clang --help 2>&1 | grep -iE "float|fpu|fprev" | head -10 | sed 's/^/::notice::help: /'
          strings $tc/clang 2>/dev/null | grep -iE "^(\+|-)?(fp|fpu|float|hard-float|soft-float|fprev)[a-z0-9_-]*$" | sort -u | head -20 | tr '\n' ' ' | sed 's/^/::notice::clang strings: /'; echo
          grep -rhoE -- "-m[a-z0-9_=,.-]+" ~/fw-AC79_AIoT_SDK --include="Makefile*" --include="*.mk" --include="*.lua" 2>/dev/null | sort | uniq -c | sort -rn | head -25 | sed 's/^/::notice::sdk flag: /'
          grep -rlE "fprev|hard-float|mfpu|__fp|fpu" ~/fw-AC79_AIoT_SDK --include="Makefile*" --include="*.mk" --include="*.h" 2>/dev/null | head -8 | sed 's/^/::notice::sdk fpu file: /'
          grep -rhE "fprev|mfpu|hard-float|float-abi" ~/fw-AC79_AIoT_SDK --include="Makefile*" --include="*.mk" 2>/dev/null | head -8 | sed 's/^/::notice::sdk fpu line: /'
          echo 'float f(float a, float b) { return a * b + 1.0f; }' > /tmp/f.c
          for o in "" "-mfprev1" "-mhard-float" "-mfloat-abi=hard"; do
            if $tc/clang -target pi32v2 -Os $o -c /tmp/f.c -o /tmp/f.o 2>/tmp/f.err; then
              ~/.jieli/toolchain/common/bin/objdump -d /tmp/f.o 2>&1 | grep -vE "^$|file format|Disassembly" | head -8 | tr -s ' \t' ' ' | tr '\n' '|' | sed "s/^/::notice::float [$o]: /"; echo
            else
              head -2 /tmp/f.err | tr '\n' ' ' | sed "s/^/::notice::float [$o] refused: /"; echo
            fi
          done

      - name: Emscripten (browser emulator)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Build browser emulator
        run: EMU_PREVIEW=0 sh web/emu/build.sh

      - name: Make installer site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the site's installer: the latest published release, else this build
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'felucca-*.fwsc' --dir rel 2>/dev/null; then
            pkg=$(ls rel/felucca-*.fwsc | head -1)
            ver=$(basename "$pkg" .fwsc); ver="${ver#felucca-}"
            python3 web/make_site.py "$pkg" "$ver" _site
          else
            python3 web/make_site.py build/felucca.fwsc "opx-${GITHUB_SHA::7}" _site
          fi
          python3 web/make_site.py build/felucca.fwsc "opx-${GITHUB_SHA::7}" _site/dev   # this build's, always
          mkdir -p _site/opx && cp web/opx/*.html _site/opx/
          mkdir -p _site/webapp/try && cp -R build/emu/. _site/webapp/try/
          mkdir -p _site/try                                # (the older address)
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Felucca-OPX</title><meta http-equiv="refresh" content="0; url=../webapp/try/"><a href="../webapp/try/">Felucca-OPX in your browser</a>' > _site/try/index.html

      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: build/felucca.fwsc

      - if: env.REL != ''
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: build/release-${{ env.REL }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || { grep -a -iE "error|undefined|FAIL" build.log | head -30 | sed 's/^/::error::/'; exit 1; }

      - name: Emscripten (browser emulator)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Host tests
        shell: bash
        run: |
          set -o pipefail
          rc=0
          tests/run_tests.sh 2>&1 | tee host_tests.log || rc=$?
          # failing checks and the target cost lines as annotations (readable through the API without the log)
          grep -a -E "FAIL|OVER BUDGET|no budget" host_tests.log | grep -av "TESTS FAILED" | head -40 | sed 's/^/::error::/' || true
          grep -a -E "^opx: cost|target: .*opx" host_tests.log | head -10 | sed 's/^/::notice::/' || true
          exit $rc

  # a published release: its files once the tests pass, then a run on opx-engine for the site
  release-files:
    needs: [build, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release
          path: release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -qr LICENSES.zip LICENSES
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            felucca-*.fwsc felucca-*-app.bin SHA256SUMS LICENSE LICENSING.md LICENSES.zip $(ls ATTRIBUTION.txt 2>/dev/null)
      - name: Publish the site with it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref opx-engine
