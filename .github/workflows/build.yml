name: Build and publish

# A push to opx-engine: build, test, publish the site (its installer offers the latest published release; this
# build's installer is under dev/). A release published on GitHub (tag vX.Y.Z): build it as that version, test
# it, attach the package and its licence files to the release, then run this workflow on opx-engine, which publishes
# the site with it. (The site is deployed from the branch only: GitHub Pages' environment takes the default branch.)
on:
  push:
    branches: [opx-engine]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          # a failing build's errors as annotations (readable through the API without the log)
          b() { ./build.sh "$@" 2>&1 | tee -a build.log || { grep -a -iE "error|undefined|FAIL|overflow|not fit|region|relocation|truncat|bin/ld:" build.log | head -30 | sed 's/^/::error::/'; exit 1; }; }
          if [ "${{ github.event_name }}" = release ]; then
            ver="${GITHUB_REF_NAME#v}"
            b --release "$ver"
            export FELUCCA_OPX_ONLY=1; b --release "$ver"; unset FELUCCA_OPX_ONLY   # (Solo's files beside them)
            echo "REL=$ver" >> "$GITHUB_ENV"
          fi
          export FELUCCA_OPX_ONLY=1; b; unset FELUCCA_OPX_ONLY   # (the OPX-only firmware first: build/opx-solo.fwsc, kept aside)
          mkdir -p solo && cp build/opx-solo.fwsc solo/ && cp build/felucca.dis solo/opx-solo.dis
          grep -a -E "  ok +image " build.log | tail -1 | sed 's/^/::notice::size (OPX-only): /' || true
          b                                            # (the development build: build/felucca.fwsc)
          grep -a -E "^app |^package |  ok +image " build.log | tail -3 | sed 's/^/::notice::size: /' || true   # (the app's room: 0x8DFBC = 581564 B, firmware/app.ld XIP)

      - name: Emscripten (browser emulator)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Build browser emulator
        run: |
          EMU_PREVIEW=0 sh web/emu/build.sh
          EMU_PREVIEW=0 EMU_OUT=build/emu-solo EMU_TAG=-opx-solo EMU_CFLAGS=-DFELUCCA_OPX_ONLY=1 sh web/emu/build.sh
          if [ -n "$REL" ]; then                       # a release: its simulators and editor travel with it (the site's)
            python3 web/make_site.py "build/release-$REL/opx-$REL.fwsc" "$REL" relsite
            mkdir -p relweb && cp -R build/emu relweb/try && cp -R build/emu-solo relweb/try-solo \
              && cp -R relsite/webapp/editor relweb/editor
            (cd relweb && zip -qr "../build/release-$REL/opx-$REL-web.zip" .)
          fi

      - name: Make installer site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the site (web/site_nav.py links its pages): ./ the latest release (else this build), dev/ this build;
          # opx-solo/ and dev/opx-solo/ the same for OPX Solo; each with its installer, editor, simulator
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.fwsc' --pattern '*-web.zip' \
               --dir rel 2>/dev/null; then
            pkg=$(ls rel/*.fwsc | grep -v -- opx-solo- | head -1)   # (felucca-X or opx-X)
            ver=$(basename "$pkg" .fwsc); ver="${ver#felucca-}"; ver="${ver#opx-}"
            python3 web/make_site.py "$pkg" "$ver" _site
            solo=$(ls rel/opx-solo-*.fwsc 2>/dev/null | head -1 || true)   # (none: -eo pipefail)
            [ -n "$solo" ] && python3 web/make_site.py "$solo" "$ver-opx-solo" _site/opx-solo
            web=$(ls rel/*-web.zip 2>/dev/null | head -1 || true)
            if [ -n "$web" ]; then                     # (the release's own simulators and editor)
              mkdir -p relweb && unzip -q "$web" -d relweb
              mkdir -p _site/webapp/try && cp -R relweb/try/. _site/webapp/try/ && cp -R relweb/editor/. _site/webapp/editor/
              if [ -n "$solo" ]; then
                mkdir -p _site/opx-solo/webapp/try && cp -R relweb/try-solo/. _site/opx-solo/webapp/try/
                cp -R relweb/editor/. _site/opx-solo/webapp/editor/
              fi
            fi
          else
            python3 web/make_site.py build/felucca.fwsc "opx-${GITHUB_SHA::7}" _site
          fi
          python3 web/make_site.py build/felucca.fwsc "opx-${GITHUB_SHA::7}" _site/dev   # this build's, always
          mkdir -p _site/dev/webapp/try && cp -R build/emu/. _site/dev/webapp/try/
          python3 web/make_site.py solo/opx-solo.fwsc "opx-solo-${GITHUB_SHA::7}" _site/dev/opx-solo
          mkdir -p _site/dev/opx-solo/webapp/try && cp -R build/emu-solo/. _site/dev/opx-solo/webapp/try/
          python3 tools/dis_funcs.py build/felucca.dis opx_render opx_op_in opx_op_sine opx_op_tab opx_op_sqr opx_op_gen opx_noise_block opx_op_noise opx_op_mode opx_osc_block opx_mix opx_loop_sine opx_table \
              bench_callee bench_math > _site/dev/disasm.txt || true   # (the compiled render loops, readable without the toolchain)
          mkdir -p _site/opx && cp web/opx/*.html _site/opx/
          [ -f _site/webapp/try/index.html ] || { mkdir -p _site/webapp/try && cp -R build/emu/. _site/webapp/try/; }   # (no
                                                       # release simulator yet: this build's, its version on the page)
          mkdir -p _site/try                                # (the older address)
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>OPX</title><meta http-equiv="refresh" content="0; url=../webapp/try/"><a href="../webapp/try/">OPX in your browser</a>' > _site/try/index.html
          python3 web/site_nav.py _site                  # (every installer, editor and simulator links the others)

      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: build/felucca.fwsc

      - uses: actions/upload-artifact@v6
        with:
          name: firmware-opx-solo
          path: solo/opx-solo.fwsc

      - if: env.REL != ''
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: build/release-${{ env.REL }}/

      - uses: actions/upload-artifact@v6
        with:
          name: disasm
          path: |
            _site/dev/disasm.txt
            build/felucca.dis
            solo/opx-solo.dis

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  diag:   # the compiled OPX loops (dev/disasm.txt) on branch ci-diag, one commit, replaced each push: readable with git
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: disasm
      - name: Push to ci-diag
        run: |
          git init -q -b ci-diag d && find . -path ./d -prune -o \( -name '*.txt' -o -name '*.dis' \) -type f -print \
            | xargs -I{} mv {} d/ && cd d                # (disasm.txt; both firmwares' whole listings: a crash's PC)
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "disasm of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-diag

  deploy:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || { grep -a -iE "error|undefined|FAIL|overflow|not fit|region|relocation|truncat|bin/ld:" build.log | head -30 | sed 's/^/::error::/'; exit 1; }

      - name: Emscripten (browser emulator)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Host tests
        shell: bash
        run: |
          set -o pipefail
          rc=0
          tests/run_tests.sh 2>&1 | tee host_tests.log || rc=$?
          # failing checks and the target cost lines as annotations (readable through the API without the log)
          grep -a -E "FAIL|OVER BUDGET|no budget" host_tests.log | grep -av "TESTS FAILED" | head -40 | sed 's/^/::error::/' || true
          grep -a -E "^opx: cost|target: .*opx" host_tests.log | head -10 | sed 's/^/::notice::/' || true
          exit $rc

  # a published release: its files once the tests pass, then a run on opx-engine for the site
  release-files:
    needs: [build, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release
          path: release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -qr LICENSES.zip LICENSES
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            opx-*.fwsc opx-*-app.bin opx-*-web.zip SHA256SUMS LICENSE LICENSING.md LICENSES.zip \
            $(ls ATTRIBUTION.txt 2>/dev/null)
      - name: Publish the site with it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref opx-engine
