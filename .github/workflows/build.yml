name: Build and publish

on:
  push:
    branches: [opx-engine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        run: ./build.sh

      - name: Make installer site
        run: python3 web/make_site.py build/felucca.fwsc "opx-${GITHUB_SHA::7}" _site

      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: build/felucca.fwsc

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools numpy mido python-rtmidi

      - name: Restore JieLi toolchain and SDK
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Fetch JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/scripts/fetch-jieli-deps.sh

      - name: Save JieLi toolchain and SDK
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-deps-v1

      - name: Build firmware
        run: ./build.sh

      - name: Host tests
        run: tests/run_tests.sh
