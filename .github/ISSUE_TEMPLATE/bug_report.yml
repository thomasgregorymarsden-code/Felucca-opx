name: Bug report
description: Something in Felucca-OPX doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. For an idea, open a blank issue instead. Please report Felucca-OPX problems here, not to upstream Felucca.
  - type: input
    id: version
    attributes:
      label: Felucca-OPX version
      description: MENU (hold HOME) > SYSTEM > ABOUT on the FM-1
      placeholder: "v1.5.1-opx1"
    validations:
      required: true
  - type: input
    id: opx
    attributes:
      label: OPX track? (SLOT and ALG, if so)
      placeholder: "yes: SLOT OWN, ALG USR"
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
